<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="crestPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#58164b" />
      <stop offset="50%" stop-color="#4a154b" />
      <stop offset="100%" stop-color="#2a062c" />
    </linearGradient>
    <linearGradient id="crestGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="192" height="192" rx="42" fill="#0d0d0f" />
  
  <!-- Outer Shield Shadow & Base -->
  <g transform="translate(96, 92)" filter="url(#shadow)">
    <!-- Heraldic Shield Path -->
    <path d="M-62,-72 L62,-72 C62,-72 65,10 0,68 C-65,10 -62,-72 -62,-72 Z" fill="url(#crestPurple)" stroke="url(#crestGold)" stroke-width="4.5" />
    <!-- Inner Shield Inset Border -->
    <path d="M-55,-65 L55,-65 C55,-65 57,6 0,58 C-57,6 -55,-65 -55,-65 Z" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-opacity="0.75" />

    <!-- Shield Division Chevron / Division Line -->
    <path d="M-58,-20 L0,10 L58,-20" fill="none" stroke="url(#crestGold)" stroke-width="2.5" />

    <!-- Top Section: Open Book / Crest Lamp of Learning -->
    <g transform="translate(0, -44)">
      <!-- Open Book pages -->
      <path d="M-22,-8 C-14,-10 -6,-10 0,-7 C6,-10 14,-10 22,-8 L22,8 C14,6 6,6 0,9 C-6,6 -14,6 -22,8 Z" fill="#ffffff" stroke="#b45309" stroke-width="1.2" />
      <line x1="0" y1="-7" x2="0" y2="9" stroke="#b45309" stroke-width="1.5" />
      <!-- Book page line accents -->
      <line x1="-16" y1="-2" x2="-4" y2="-2" stroke="#58164b" stroke-width="1" />
      <line x1="-16" y1="2" x2="-4" y2="2" stroke="#58164b" stroke-width="1" />
      <line x1="4" y1="-2" x2="16" y2="-2" stroke="#58164b" stroke-width="1" />
      <line x1="4" y1="2" x2="16" y2="2" stroke="#58164b" stroke-width="1" />
      <!-- Gold star / flame above book -->
      <circle cx="0" cy="-14" r="3.5" fill="url(#crestGold)" />
    </g>

    <!-- Lower Section: Crossed Field Hockey Sticks and Ball -->
    <g transform="translate(0, 16)">
      <!-- Left Stick -->
      <path d="M-28,-14 L12,24 C16,28 22,29 26,25 C29,21 28,16 23,12 L-18,-18 Z" fill="url(#crestGold)" />
      <!-- Right Stick -->
      <path d="M28,-14 L-12,24 C-16,28 -22,29 -26,25 C-29,21 -28,16 -23,12 L18,-18 Z" fill="#ffffff" fill-opacity="0.95" />
      <!-- Hockey Ball -->
      <circle cx="0" cy="8" r="6" fill="#ffffff" stroke="#b45309" stroke-width="1.5" />
      <circle cx="-1.5" cy="6.5" r="1.5" fill="#f59e0b" />
    </g>

    <!-- Foundation Year Inset -->
    <text x="0" y="-12" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="8.5" font-weight="900" fill="url(#crestGold)" letter-spacing="1.2">
      1893
    </text>
  </g>

  <!-- Motto Ribbon at Base: DIXI CUSTODIAM -->
  <g transform="translate(96, 164)">
    <!-- Ribbon shape -->
    <path d="M-68,0 L-56,-7 L-48,-4 L48,-4 L56,-7 L68,0 L58,9 L46,6 L-46,6 L-58,9 Z" fill="url(#crestGold)" stroke="#78350f" stroke-width="1" />
    <text x="0" y="2.5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="900" fill="#2a062c" letter-spacing="1.2">
      DIXI CUSTODIAM
    </text>
  </g>

  <!-- Top Title Arch -->
  <text x="96" y="24" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="900" fill="#ffffff" letter-spacing="2">
    OLD ALEXANDRA
  </text>
  <text x="96" y="34" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="6.5" font-weight="800" fill="url(#crestGold)" letter-spacing="1.8">
    HOCKEY CLUB
  </text>
</svg>
